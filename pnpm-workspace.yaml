packages:
  - "apps/*"
  - "packages/*"
  - "indexer"
# tsx (apps/server) runs on esbuild, whose install script checks its native binary.
allowBuilds:
  esbuild: true
  # A dependency of the Dynamic wallet SDK; its script only checks versions.
  protobufjs: false
minimumReleaseAgeExclude:
  - framer-motion@13.3.0
  - lucide-react@1.46.0
  - motion-dom@13.3.0
  - motion-utils@13.3.0
  - motion@13.3.0
