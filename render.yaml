# Render Blueprint for the Baret analysis API (apps/server).
# Render → New → Blueprint → this repo. Secrets marked `sync: false` are
# entered in the Render dashboard, never here. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: baret-monad-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # Deploy only after the GitHub checks on the commit pass (CI is the gate).
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/server/**
        - packages/guard/**
        - packages/content/**
        - packages/llm/**
        - packages/agent-kit/**
        - pnpm-lock.yaml
        - render.yaml
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter @baret/server...
    # Run tsx directly: `pnpm start` would re-check (and re-install) the whole
    # workspace before every boot.
    startCommand: cd apps/server && ./node_modules/.bin/tsx src/main.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: LOG_LEVEL
        value: info
      - key: MONAD_TESTNET_RPC_URL
        sync: false
      - key: MONAD_TESTNET_TRACE_RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: MONAD_TESTNET_USDC_ADDRESS
        sync: false
      - key: MONAD_TESTNET_REPUTATION_REGISTRY_ADDRESS
        sync: false
      - key: MONAD_TESTNET_KNOWN_CONTRACTS
        sync: false
      - key: MONAD_TESTNET_PAYMENT_GUARD_FACTORY_ADDRESS
        value: "0xDe897d4dF6E1c34aB868948dE035AE29D32eA822"
      - key: BARET_API_KEYS
        sync: false
      - key: BARET_CORS_ORIGINS
        sync: false
      - key: ENVIO_ENDPOINT
        sync: false
      - key: NANSEN_API_KEY
        sync: false
      - key: NANSEN_MODE
        value: funder
      # Cleanverse on Monad testnet: A-Pass (identity) and the aToken policy.
      # Public contract addresses, from Cleanverse's query_chain_config.
      - key: MONAD_TESTNET_CLEANVERSE_APASS_ADDRESS
        value: "0xbA82D189540CaC9DC6FF46B6837CaC1BFdEC58B9"
      - key: MONAD_TESTNET_CLEANVERSE_POLICY_ADDRESS
        value: "0x36489bE45fa84f70a0c2BDB11D824Be608CB12Dd"
      # KIMI (Moonshot) for /v1/explain. Without the key the route answers 503.
      - key: KIMI_API_KEY
        sync: false
      # Qwen (QwenCloud) for /v1/review. Without the key the route answers 503.
      - key: QWEN_API_KEY
        sync: false
      # The demo agent's key: an approved honest review sends 0.10 dUSDC from
      # Baret's demo vault on Monad testnet.
      - key: BARET_DEMO_AGENT_PRIVATE_KEY
        sync: false
      - key: BARET_REVIEW_SEND
        value: "1"
      # Sealed settings: the store's public address, and the key that pays the
      # gas of POST /v1/sealed (a testnet key holding MON and nothing else).
      - key: MONAD_TESTNET_SEALED_STORE_ADDRESS
        value: "0xC094af68bE1039f70E1362C2f326542BB2DC21BB"
      - key: BARET_SEALED_RELAYER_PRIVATE_KEY
        sync: false
