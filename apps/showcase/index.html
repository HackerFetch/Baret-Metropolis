<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Baret</title>
    <meta
      name="description"
      content="Baret reads every Monad transaction before you sign it. It simulates what will happen, checks it against rules you set, and tells you what it found."
    />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Big+Shoulders+Stencil+Display:wght@900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong ground. Absent attribute means follow the operating system.
      try {
        const stored = localStorage.getItem("baret.theme");
        if (stored === "dark" || stored === "light") {
          document.documentElement.dataset.theme = stored;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
