<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Baret Wallet</title>
    <!-- An app, not a site: kept out of search, like public/robots.txt. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="A Monad wallet that reads every transaction before you sign it. No recovery phrase, just a passkey." />
    <!-- Link previews (Slack, Discord, X, the submission form). The card is the showcase's og.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Baret" />
    <meta property="og:title" content="Baret Wallet" />
    <meta property="og:description" content="A Monad wallet that reads every transaction before you sign it. No recovery phrase, just a passkey." />
    <meta property="og:url" content="https://baret-wallet.vercel.app/" />
    <meta property="og:image" content="https://baret-metropolis.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Baret: a security layer that reads every transaction on Monad before it is signed." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Baret Wallet" />
    <meta name="twitter:description" content="A Monad wallet that reads every transaction before you sign it. No recovery phrase, just a passkey." />
    <meta name="twitter:image" content="https://baret-metropolis.vercel.app/og.png" />
    <!--
      The ground before the first CSS byte, so no white frame flashes:
      graphite, or concrete when the theme resolves to light. Same rule as the
      showcase (apps/showcase/index.html).
    -->
    <style>
      @layer theme, base, components, utilities;
      @layer base {
        html {
          background: #17181b;
        }
        @media (prefers-color-scheme: light) {
          :root:not([data-theme="dark"]) {
            background: #e6e6e1;
          }
        }
        :root[data-theme="light"] {
          background: #e6e6e1;
        }
      }
    </style>
    <!-- The browser bar follows the ground: graphite, or concrete in light. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17181b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e6e6e1" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <!--
      Self-hosted faces, shared with the showcase (packages/web-ui, served at
      /fonts by its webUiFonts() plugin). The display face is preloaded: it
      loads with display=optional, so a late file would leave the fallback.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/big-shoulders-display-800.woff2"
    />
    <link rel="stylesheet" href="/src/fonts.css" />
    <script>
      try {
        const stored = localStorage.getItem("baret.theme");
        if (stored === "dark" || stored === "light") {
          document.documentElement.dataset.theme = stored;
          // A chosen theme wins over the system one in the browser bar too.
          const color = stored === "light" ? "#e6e6e1" : "#17181b";
          for (const meta of document.querySelectorAll('meta[name="theme-color"]')) meta.content = color;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
