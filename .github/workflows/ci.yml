name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The indexer has its own generated types (envio codegen), outside tsc -b.
      - run: pnpm --filter @baret/indexer typecheck
      - run: pnpm lint:copy
      - run: pnpm test

  build:
    name: Build apps
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Zip the extension
        # The published zips grant host access to the deployed API only (H8);
        # without this they would point at the local server.
        env:
          WXT_BARET_API_URL: https://baret-monad-api.onrender.com
        run: |
          pnpm --filter @baret/extension zip
          pnpm --filter @baret/extension zip:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: baret-extension-${{ github.sha }}
          path: apps/extension/.output/*.zip
          # .output is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  release-extension:
    name: Publish the extension zips
    # /install links to these: a CI artifact needs a GitHub login, a release
    # asset does not. One rolling release, replaced on every push to main.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: baret-extension-${{ github.sha }}
          path: zips
      - name: Give the zips stable names
        run: |
          cp zips/*-chrome.zip baret-chrome.zip
          cp zips/*-firefox.zip baret-firefox.zip
          ls -l baret-*.zip
      - name: Replace the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete extension-latest --yes --cleanup-tag || true
          gh release create extension-latest baret-chrome.zip baret-firefox.zip \
            --target "${{ github.sha }}" --latest \
            --title "Baret extension (latest build)" \
            --notes "Built from ${{ github.sha }}. Chrome: load unpacked after unzipping. Firefox: about:debugging, Load Temporary Add-on."

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
