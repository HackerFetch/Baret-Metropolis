name: Keep the API warm

# Render's free plan sleeps a service after 15 minutes without traffic, and
# the first request then takes close to a minute: longer than the 15 seconds
# the demo sites wait before they fail closed. One request every 10 minutes
# keeps the instance up.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the API if it is ready
        run: |
          curl --silent --show-error --fail --max-time 120 \
            https://baret-monad-api.onrender.com/health/ready
      # The hosted indexer is deleted after seven days without a request.
      # This goes through the API, so it also shows the audit trail is up.
      - name: Ask for the latest audit entries
        continue-on-error: true
        run: |
          curl --silent --show-error --fail --max-time 60 \
            "https://baret-monad-api.onrender.com/v1/audit/recent?limit=1"
